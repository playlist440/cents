name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python tools/check_library.py
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Eerst lokaal bouwen en echt opstarten; pas publiceren als de app antwoordt.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cents:smoke
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name cents -p 8000:8000 --cap-drop ALL --security-opt no-new-privileges:true cents:smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/healthz | grep -q '"ok"'
          curl -fsS http://127.0.0.1:8000/api/session | grep -q '"setup_required":true'
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<title>'
          curl -fsS -o /dev/null http://127.0.0.1:8000/manifest.webmanifest
          test "$(docker exec cents id -u)" = "1000"
          docker exec cents sh -c 'test -w /data && ! test -w /app/backend'
          docker logs cents | tail -5
          docker rm -f cents
      - id: version
        run: echo "version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' backend/cents/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
